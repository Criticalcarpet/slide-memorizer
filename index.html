<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Pathology Slides</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="./images/slider-192.png" type="image/x-icon">
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"
    />
    <script type="module" src="script.js"></script>
    <script type="module" src="slide.js"></script>
    <script type="module" src="search.js"></script>
    <script type="module" src="dropdown.js"></script>
  </head>

  <body>
    <div class="header">
      <span><img src="./images/slider-192.png" alt="Icon" id="web-logo"> Slide Memoriser</span>

      <div id="nav-activator"><i id="hamburger" class="ti ti-menu-2"></i></div>
    </div>
    <div id="overlay"></div>
    <nav id="navbar">
      <ul class="navlist">
        <li class="selected">Pathology</li>
        <li>Microbiology</li>
        <li>Pharmacology</li>
      </ul>
    </nav>
    <main>
      <div id="search-bar">
        <i id="search-icon" class="ti ti-search"></i
        ><input
          type="text"
          placeholder="Search number or name of the slide"
          id="search-input"
        />
      </div>
      <section class="fixed">
        <div class="dropdown">
          <button id="dropBtn">Select Specimen ▾</button>
          <div id="dropContent" class="dropdown-content hidden">
            <a href="#slide" class="selected" id="patho-slide">Pathology - Slides</a>
            <a href="#gross" id="patho-gross">Pathology - Gross</a>
          </div>
        </div>
        <div class="test-box">
          <span>Active Recall Sessions</span>
          <span>Test your rentention on results</span>
          <button>Reveal Recall</button> <button>Test Match</button>
        </div>
      </section>
      <!--<div class="ribbon-bar">
        <div class="ribbon-item">All</div>
        <div class="ribbon-item">Bookmarked</div>
        <div class="ribbon-item">Learning</div>
        <div class="ribbon-item">Mastered</div>
      </div>-->
      <section id="moving-slides"></section>
      <section id="moving-gross" class="hidden"></section>
    </main>
  </body>
</html>
